<mat-carousel
  timings="250ms ease-in"
  [autoplay]="false"
  interval="5000"
  color="accent"
  maxWidth="auto"
  proportion="25"
  slides="5"
  [loop]="true"
  [hideArrows]="true"
  [hideIndicators]="true"
  [useKeyboard]="true"
  [useMouseWheel]="false"
  orientation="ltr"
>
  <mat-carousel-slide
    #matCarouselSlide    
    image="https://lorempixel.com/250/250/nature/1"
    overlayColor="#00000040"
    [hideOverlay]="false"
  ></mat-carousel-slide>

  #matCarouselSlide    
  image="https://lorempixel.com/250/250/nature/1"
  overlayColor="#00000040"
  [hideOverlay]="false"
></mat-carousel-slide>
</mat-carousel>
