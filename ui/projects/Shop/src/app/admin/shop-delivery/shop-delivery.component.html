
<button mat-raised-button color="primary" type="button" (click)="editDeliveryLoc(null)">Add Delivery Location</button>

<ng-container *ngIf="(deliveries$ | async) as deliveries">
  <table mat-table [dataSource]="deliveries" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

    <!-- Number Column -->
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> No. </th>
      <td mat-cell *matCellDef="let element; let i = index">{{i + 1}}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element">
        <a href="javascript:{}" (click)="editDeliveryLoc(element)" matTooltip="Click here to view or edit this delivery">{{element.name}}</a>
      </td>
    </ng-container>

    <!-- Charge Column -->
    <ng-container matColumnDef="need_cust_loc">
      <th mat-header-cell *matHeaderCellDef> Customer Location </th>
      <td mat-cell *matCellDef="let element">
        {{ (element.need_cust_loc) ? 'Yes' : 'No' }}
      </td>
    </ng-container>

    <!-- Charge Column -->
    <ng-container matColumnDef="charge">
      <th mat-header-cell *matHeaderCellDef> Charge </th>
      <td mat-cell *matCellDef="let element">
        {{ element.charge }}
      </td>
    </ng-container>


     <!-- Options Column -->
     <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef> Delete </th>
      <td mat-cell *matCellDef="let element">
        <button type="button" mat-icon-button  color="warn"
          (click)="deleteDeliveryLoc(element)">
          <mat-icon>delete_forever</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</ng-container>
