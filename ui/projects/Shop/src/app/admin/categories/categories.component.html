<h3>Categories</h3>
<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" (click)="editCategory(null)">
  Create Category
</button>

<!-- Modal -->
<div class="modal fade" id="createCategory" data-backdrop="static"  tabindex="-1" aria-labelledby="createCategoryLabel" aria-hidden="true">
  <app-create-category [category]="category"></app-create-category>
</div>

<table class="table">
  <thead>
    <tr>
      <th>
        No
      </th>
      <th>
        Name
      </th>
      <th>
        Icon
      </th>
      <th>
        Status
      </th>
      <th>
        Options
      </th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngIf="(categories$ | async) as categories">
      <tr *ngFor="let category of categories; let i = index" [ngClass]="{ 'text-warning' : !category.status}">
        <td>
            {{ i+1 }}
        </td>
        <td>
          <a href="javascript:{}" (click)="editCategory(category)">{{category.name}}</a>
        </td>
        <td>
          <img class="img-thumbnail" [src]="environment.siteAddress+'/assets/shop/'+environment.shopKey+'/category/'+category.icon" *ngIf="category.icon"/>
        </td>
        <td>
          {{ category.status_text}}
        </td>
        <td>
          <a href="javascript:{}" class="text-danger" (click)="deleteCategory(category)">Delete</a>
        </td>
      </tr>
      <tr *ngIf="!categories || !categories.length">
        <td colspan="5">
          <div class="alert alert-warning">
            No product found
          </div>
        </td>
      </tr>
    </ng-container>

  </tbody>
</table>
