<div class="header-inner"></div>
<h3>Products</h3>

<button mat-raised-button color="primary" type="button"  (click)="editProduct(null)">Create Product</button>
<app-search-product  [pageEvent]="pageEvent"></app-search-product>
<ng-container *ngIf="(products$ | async) as products">
  <table class="responsive-table highlight">
    <thead>
      <th>
        No.
      </th>
      <th>
        Name
      </th>
      <th>
        Category
      </th>
      <th>
        Status
      </th>
      <th>
        Delete
      </th>
    </thead>
    <tbody>
      <ng-container *ngIf="products && products.data.length">
        <tr *ngFor="let element of products.data; let i = index;">
          <td>
            {{i + 1}}
          </td>
          <td>
            <a href="javascript:{}" (click)="editProduct(element)" matTooltip="Click here to view or edit this product">{{element.name}}</a>
          </td>
          <td>
            {{ element.shop_product_category?.name}}
          </td>
          <td>
            <a href="javascript:{}" (click)="changeStatus(element)"> {{element.status_text}} </a>
          </td>
          <td>
            <button  type="button" mat-icon-button  color="warn"
              (click)="deleteProduct(element)">
              <mat-icon>delete_forever</mat-icon>
            </button>
          </td>
        </tr>
      </ng-container>
      <tr *ngIf="!products || !products.data || !products.data.length">
        <td colspan="5">
          No product found
        </td>
      </tr>
    </tbody>


  </table>


  <mat-paginator *ngIf="products.total" [length]="products.total"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              (page)="goto($event)">
  </mat-paginator>

</ng-container>
