<app-order-search [pageEvent]="pageEvent"></app-order-search>
<ng-container *ngIf="(orders$ | async) as orders">

  <table mat-table [dataSource]="orders.data" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

    <!-- Number Column -->
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> No. </th>
      <td mat-cell *matCellDef="let element; let i = index">{{i + 1}}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element">
        <a href="javascript:{}" (click)="viewOrder(element)" matTooltip="Click here to view details about this order"
        >{{element.shop_customer.name}}</a>
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef> Total </th>
      <td mat-cell *matCellDef="let element"> ₹ {{element.total}} </td>
    </ng-container>



    <!-- Delivery location Column -->
    <ng-container matColumnDef="delivery_location">
      <th mat-header-cell *matHeaderCellDef> Delivery </th>
      <td mat-cell *matCellDef="let element"> {{element.shop_delivery.name}} </td>
    </ng-container>

    <!-- Delivery location Column -->
    <ng-container matColumnDef="delivery_date">
      <th mat-header-cell *matHeaderCellDef> Delivery Date </th>
      <td mat-cell *matCellDef="let element">
        <span *ngIf="element.delivery_at">{{ element.delivery_at | date: 'medium'}} </span>
      </td>
    </ng-container>

    <!-- created_at location Column -->
    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef> Order Date </th>
      <td mat-cell *matCellDef="let element"> {{element.created_at | date:'medium'}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> {{element.status_text}} </td>
    </ng-container>



    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="orders.total"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              (page)="goto($event)">
  </mat-paginator>



</ng-container>
