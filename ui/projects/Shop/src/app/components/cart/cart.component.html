<ng-container *ngIf="(cart$ | async) as cart">
  <ng-container *ngIf="cart && cart.length ">
    <!-- && !cartDetails -->
    On Your Bag {{cart.length}} {{ cart.length > 1 ? 'items' : 'item' }}
    Total Price : {{ total}}

    <button mat-stroked-button color="primary" (click)="showDetails()">Details</button>



  </ng-container>
</ng-container>
