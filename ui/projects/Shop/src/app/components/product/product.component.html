
<div
class="search-results"
infiniteScroll
[infiniteScrollDistance]="2"
[infiniteScrollThrottle]="50"
(scrolled)="loadMore()"
infiniteScrollContainer=".my-sidenav-content" [fromRoot]="true"
></div>

<div class="row" >

<ng-container *ngIf="(products$ | async) as products">

  <div class="col s6 m4 l3 xl3 mb1" *ngFor="let product of allProduct" >
    <mat-card >
      <mat-card-header>
        <div mat-card-avatar ></div>
        <mat-card-title> {{ product.name }}</mat-card-title>
        <mat-card-subtitle>{{ product.shop_product_primary_variant?.name}}</mat-card-subtitle>
      </mat-card-header>
      <img mat-card-image *ngIf="product.shop_product_primary_variant?.shop_product_image?.image" [src]="environment.siteAddress+'/assets/shop/'+environment.shopKey+'/products/'+ product.shop_product_primary_variant.shop_product_image.image" alt="Photo of a Shiba Inu">
      <mat-card-content>
        ₹ {{ product.shop_product_primary_variant?.price}}

        <del *ngIf="product.shop_product_primary_variant?.actual_price">₹ {{ product.shop_product_primary_variant?.actual_price}}</del>
        <p *ngIf="product.shop_product_variant.length > 1">
          Total Varients: {{ product.shop_product_variant.length }}
        </p>
        <p [innerHTML]="product.description"></p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button  (click)="addToCart(product)">Buy Now</button>
        <button mat-button [routerLink]="'/'+product.shop_product_category?.url+'/'+product.url">Details</button>
      </mat-card-actions>
    </mat-card>
  </div>
  <a href="javascript:{}" (click)="loadMore()" *ngIf="(products.next_page_url)">Load More</a>
</ng-container>
</div>
