  <mat-sidenav-container [hasBackdrop]="true" fullscreen>
    <mat-sidenav #sidenav role="navigation" [mode]="'side'">
      <app-side-nav-list (sidenavClose)="sidenav.close()"></app-side-nav-list>
    </mat-sidenav>
    <mat-sidenav-content cdkscrollable class="my-sidenav-content">
      <app-header (sidenavToggle)="sidenav.toggle()"></app-header>
      <main>
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
